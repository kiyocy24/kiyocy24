name: Update profile cards

on:
  schedule:
    - cron: "17 18 * * *" # 毎日 03:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # 非公開リポジトリも集計したい場合は repo / read:user 権限の PAT を STATS_TOKEN に登録する
  TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&theme=default
          path: profile/stats-light.svg
          token: ${{ env.TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ env.TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=default
          path: profile/top-langs-light.svg
          token: ${{ env.TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ env.TOKEN }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.44.4

      - name: Trophy cards
        env:
          GITHUB_TOKEN1: ${{ env.TOKEN }}
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git "$RUNNER_TEMP/trophy"
          cd "$RUNNER_TEMP/trophy"
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts \
            "${{ github.repository_owner }}" "$GITHUB_WORKSPACE/profile/trophy-light.svg" default
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts \
            "${{ github.repository_owner }}" "$GITHUB_WORKSPACE/profile/trophy-dark.svg" darkhub

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
